name: BuildDeploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      channel:
        description: 'Release channel. none = stable RTM; alpha/beta/rc cut a pre-release.'
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

      sourceRef:
        description: 'Optional git ref (tag/branch/SHA) to release from. Leave blank to release from this branch.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-${{ inputs.sourceRef || github.ref }}
  cancel-in-progress: false

env:
  configuration: Release
  minMajorMinorVersion: '1.1'

jobs:
  release:
    name: Release approval, build, test, and pack
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
    outputs:
      semver2: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sourceRef }}
          fetch-depth: 0

      - name: Compute release version
        id: release-version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          TAG_PREFIX: v
          MINIMUM_MAJOR_MINOR: ${{ env.minMajorMinorVersion }}
        run: |
          set -euo pipefail

          case "$BUMP" in
            major|minor|patch) ;;
            *)
              echo "::error::bump must be one of major|minor|patch (got '$BUMP')."
              exit 1
              ;;
          esac

          case "$CHANNEL" in
            none) PRE_RELEASE_ID="" ;;
            alpha|beta|rc) PRE_RELEASE_ID="$CHANNEL" ;;
            *)
              echo "::error::channel must be none|alpha|beta|rc (got '$CHANNEL')."
              exit 1
              ;;
          esac

          FLOOR="${MINIMUM_MAJOR_MINOR}.0"
          LAST="$(
            git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              | grep -Ev -- '-' \
              | sort -V \
              | tail -1 \
              | sed "s/^${TAG_PREFIX}//" || true
          )"

          BASELINE="$FLOOR"
          if [ -n "$LAST" ]; then
            BASELINE="$(printf '%s\n%s\n' "$FLOOR" "$LAST" | sort -V | tail -1)"
          else
            echo "No RTM tag (${TAG_PREFIX}X.Y.Z) found; using MinVer floor ${FLOOR} as the release baseline."
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$BASELINE"
          case "$BUMP" in
            major) CORE="$((MAJOR + 1)).0.0" ;;
            minor) CORE="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) CORE="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          if [ -n "$PRE_RELEASE_ID" ]; then
            MAXN=0
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue

              number="${tag##*.}"
              case "$number" in
                ''|*[!0-9]*) continue ;;
              esac

              if [ "$number" -gt "$MAXN" ]; then
                MAXN="$number"
              fi
            done < <(git tag --list "${TAG_PREFIX}${CORE}-${PRE_RELEASE_ID}.[0-9]*")

            VERSION="${CORE}-${PRE_RELEASE_ID}.$((MAXN + 1))"
            PRERELEASE=true
          else
            VERSION="$CORE"
            PRERELEASE=false
          fi

          TAG="${TAG_PREFIX}${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Refusing to re-release an existing version."
            exit 1
          fi

          echo "Release baseline: ${TAG_PREFIX}${BASELINE} -> next (${BUMP}${PRE_RELEASE_ID:+, ${PRE_RELEASE_ID}}): ${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "MINVERVERSIONOVERRIDE=${VERSION}"
            echo "MinVerVersionOverride=${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Resolve writable branch for a major release
        if: inputs.bump == 'major'
        id: release-branch
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.sourceRef }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ -z "$REQUESTED_SOURCE_REF" ]; then
            if [ "$DISPATCH_REF_TYPE" != "branch" ]; then
              echo "::error::A major release must run from a branch so the README version update can be committed. The workflow was dispatched from ${DISPATCH_REF_TYPE} '${DISPATCH_REF_NAME}'."
              exit 1
            fi
            BRANCH="$DISPATCH_REF_NAME"
          else
            case "$REQUESTED_SOURCE_REF" in
              refs/tags/*)
                echo "::error::A major release cannot persist the README update to tag '${REQUESTED_SOURCE_REF}'. Select a branch instead."
                exit 1
                ;;
              refs/heads/*)
                BRANCH="${REQUESTED_SOURCE_REF#refs/heads/}"
                ;;
              *)
                BRANCH="$REQUESTED_SOURCE_REF"
                ;;
            esac
          fi

          if ! git check-ref-format --branch "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Major release source '${REQUESTED_SOURCE_REF:-$DISPATCH_REF_NAME}' is not a valid branch name. SHA and tag sources are read-only for release purposes."
            exit 1
          fi

          REMOTE_REF="refs/remotes/origin/${BRANCH}"
          if ! git show-ref --verify --quiet "$REMOTE_REF"; then
            echo "::error::Major release source '${REQUESTED_SOURCE_REF:-$DISPATCH_REF_NAME}' does not resolve to remote branch '${BRANCH}'. SHA and tag sources are not writable release sources."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          BRANCH_SHA="$(git rev-parse "$REMOTE_REF")"
          if [ "$HEAD_SHA" != "$BRANCH_SHA" ]; then
            echo "::error::Checked-out commit ${HEAD_SHA} is not the tip of remote branch '${BRANCH}' (${BRANCH_SHA}); refusing to push the README update to a different source."
            exit 1
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Major release README changes will be committed to branch '${BRANCH}'."

      - name: Update README install major for a major release
        if: inputs.bump == 'major'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          python - README.md "$RELEASE_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          readme_path = Path(sys.argv[1])
          major = sys.argv[2].split('.', 1)[0]
          text = readme_path.read_text(encoding='utf-8')
          package = r'CP\.Reactive\.Agentic\.Loop\.Engineer\.MCP\.Server'
          encoded = re.compile(rf'({package}%40)\d+\.\*')
          plain = re.compile(rf'({package}@)\d+\.\*')
          text, encoded_count = encoded.subn(rf'\g<1>{major}.*', text)
          text, plain_count = plain.subn(rf'\g<1>{major}.*', text)

          if (encoded_count, plain_count) != (3, 1):
              raise SystemExit(
                  f'Expected to rewrite three URL-encoded and one plain README package references; '
                  f'rewrote {encoded_count} and {plain_count}.')

          stale = re.findall(rf'{package}(?:%40|@)(?!{re.escape(major)}\.\*)\d+\.\*', text)
          if stale:
              raise SystemExit(f'Found stale README major package references: {stale}')

          readme_path.write_text(text, encoding='utf-8', newline='\n')
          print(f'Updated all four README package references to major {major}.')
          PY

      - name: Persist README install major to the release branch
        if: inputs.bump == 'major'
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${RELEASE_VERSION%%.*}"

          if git diff --quiet -- README.md; then
            echo "README already selects major ${MAJOR}.*; no release documentation commit is needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- README.md
            git commit --only README.md -m "docs: update RALE install version to ${MAJOR}.*"
            git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          fi

      - name: Resolve built commit SHA
        id: sourcesha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Build and pack unsigned NuGet packages
        shell: pwsh
        env:
          MinVerVersionOverride: ${{ steps.release-version.outputs.version }}
        run: |
          $process = Start-Process -FilePath pwsh -ArgumentList @(
            '-NoLogo', '-NoProfile', '-File', '.\build.ps1',
            'Pack', '--configuration', '${{ env.configuration }}'
          ) -NoNewWindow -PassThru
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(20)
          while (-not $process.HasExited) {
            if ([DateTimeOffset]::UtcNow -ge $deadline) {
              & taskkill.exe /PID $process.Id /T /F | Out-Host
              throw 'Build and pack exceeded the 20-minute command limit.'
            }
            Write-Host "Build and pack is active (PID $($process.Id)); next check in 30 seconds."
            Start-Sleep -Seconds 30
          }
          if ($process.ExitCode -ne 0) {
            throw "Build and pack failed with exit code $($process.ExitCode)."
          }

      - name: Upload unsigned packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-nuget
          path: |
            packages/*.nupkg
            !packages/*.symbols.nupkg
          if-no-files-found: error

  sign:
    name: Release approval and package signing
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: read
    container:
      image: ghcr.io/reactiveui/certum-signer@sha256:fb03892c379b6703bee9bfd7a2f66df3a5696de149d6d6240e1897ae15afc3e4
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - name: Download unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-nuget
          path: signed

      - name: Resolve prebuilt SimplySign paths
        shell: bash
        run: |
          set -euo pipefail
          : "${SS_DIST:?prebuilt image must set SS_DIST}"
          {
            echo "SS_DIST=$SS_DIST"
            echo "SS_START=$(find "$SS_DIST/" -name 'SimplySignDesktop_start' -type f | head -1)"
            echo "SS_EXE=$(find "$SS_DIST/" -name 'SimplySignDesktop' -type f | head -1)"
            echo "SS_PKCS11=$(find "$SS_DIST/" -name 'SimplySignPKCS*.so' | head -1)"
          } >> "$GITHUB_ENV"
          [ -n "$(find "$SS_DIST/" -name 'SimplySignDesktop' -type f | head -1)" ] || {
            echo "::error::SimplySignDesktop was not found."
            exit 1
          }
          [ -n "$(find "$SS_DIST/" -name 'SimplySignPKCS*.so' -type f | head -1)" ] || {
            echo "::error::SimplySign PKCS#11 module was not found."
            exit 1
          }

      - name: Start headless display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 3
          mkdir -p "$HOME/.fluxbox"
          printf 'session.screen0.rootCommand: /bin/true\n' > "$HOME/.fluxbox/init"
          DISPLAY=:99 fluxbox >"$RUNNER_TEMP/fluxbox.log" 2>&1 &
          sleep 2
          DISPLAY=:99 xdpyinfo >/dev/null && echo "X display :99 up"

      - name: Connect SimplySign
        shell: bash
        env:
          DISPLAY: ':99'
        run: |
          set -euo pipefail
          : "${CERTUM_USER_ID:?map the CERTUM_USER_ID secret into the job env}"
          : "${CERTUM_OTP_URI:?map the CERTUM_OTP_URI secret into the job env}"

          export USER="${USER:-root}"
          cp "$SS_DIST/SimplySignDesktop.xml" "$HOME/" 2>/dev/null || true
          mkdir -p "$HOME/.config"
          {
            echo "[General]"
            echo "CacheUserIdAtLogon=Yes"
            echo "ShowLogonDialogAfterApplicationStartup=Yes"
            echo "ShowLogonDialogWhenAnyAppRequestsAccess=Yes"
          } > "$HOME/.config/Unknown Organization.conf"

          export LD_LIBRARY_PATH="$SS_DIST:${LD_LIBRARY_PATH:-}"
          if [ -n "${SS_START:-}" ]; then
            "$SS_START" >"$RUNNER_TEMP/simplysign.log" 2>&1 &
          else
            "$SS_EXE" >"$RUNNER_TEMP/simplysign.log" 2>&1 &
          fi
          sleep 20

          OTP="$(python3 -c 'import os,hmac,hashlib,base64,struct,time;from urllib.parse import urlparse,parse_qs;q=parse_qs(urlparse(os.environ["CERTUM_OTP_URI"]).query);s=q["secret"][0];digits=int(q.get("digits",["6"])[0]);period=int(q.get("period",["30"])[0]);algo={"SHA1":hashlib.sha1,"SHA256":hashlib.sha256,"SHA512":hashlib.sha512}[q.get("algorithm",["SHA1"])[0].upper()];key=base64.b32decode(s+"="*((8-len(s)%8)%8));h=hmac.new(key,struct.pack(">Q",int(time.time()//period)),algo).digest();o=h[-1]&0xF;print(str((int.from_bytes(h[o:o+4],"big")&0x7fffffff)%(10**digits)).zfill(digits))')"
          echo "::add-mask::$OTP"

          WID=""; BX=0; BY=0; BW=0; BH=0
          for attempt in $(seq 1 30); do
            best=0; WID=""
            for w in $(xdotool search --name '' 2>/dev/null); do
              nm="$(xdotool getwindowname "$w" 2>/dev/null || true)"
              case "$nm" in *implySign*) ;; *) continue ;; esac
              eval "$(xdotool getwindowgeometry --shell "$w" 2>/dev/null)"
              area=$(( ${WIDTH:-0} * ${HEIGHT:-0} ))
              if [ "$area" -gt "$best" ]; then best=$area; WID=$w; BX=${X:-0}; BY=${Y:-0}; BW=${WIDTH:-0}; BH=${HEIGHT:-0}; fi
            done
            [ "${BW:-0}" -ge 400 ] && [ "${BH:-0}" -ge 300 ] && { echo "login window $WID ${BW}x${BH} (attempt $attempt)"; break; }
            WID=""; sleep 2
          done

          [ -z "$WID" ] && { echo "::error::SimplySign login window did not appear"; cat "$RUNNER_TEMP/simplysign.log" || true; exit 1; }
          xdotool windowactivate --sync "$WID" || xdotool windowactivate "$WID" || true
          xdotool windowraise "$WID" || true
          sleep 1

          xdotool mousemove $((BX + BW/2)) $((BY + BH*39/100)) click 1; sleep 1
          xdotool type --clearmodifiers --delay 50 "$CERTUM_USER_ID"
          xdotool key Tab; sleep 1
          xdotool type --clearmodifiers --delay 50 "$OTP"
          xdotool mousemove $((BX + BW/2)) $((BY + BH*76/100)) click 1
          sleep 8

          best=0
          for w in $(xdotool search --name '' 2>/dev/null); do
            nm="$(xdotool getwindowname "$w" 2>/dev/null || true)"
            case "$nm" in *implySign*) ;; *) continue ;; esac
            eval "$(xdotool getwindowgeometry --shell "$w" 2>/dev/null)"
            area=$(( ${WIDTH:-0} * ${HEIGHT:-0} ))
            if [ "$area" -gt "$best" ]; then best=$area; WID=$w; BX=${X:-0}; BY=${Y:-0}; BW=${WIDTH:-0}; BH=${HEIGHT:-0}; fi
          done
          xdotool windowactivate --sync "$WID" || true
          xdotool mousemove $((BX + BW/2)) $((BY + BH*94/100)) click 1
          sleep 3

          timeout 60 pkcs11-tool --module "$SS_PKCS11" -L

      - name: Sign packages with jsign
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTUM_CERT_FINGERPRINT:?map the CERTUM_CERT_FINGERPRINT secret into the job env}"

          JAR="${JSIGN_JAR:-$RUNNER_TEMP/jsign.jar}"
          if [ ! -s "$JAR" ]; then
            curl --fail --silent --show-error --location --connect-timeout 20 --max-time 120 \
              -o "$JAR" "https://repo1.maven.org/maven2/net/jsign/jsign/7.4/jsign-7.4.jar"
          fi

          CONF="$RUNNER_TEMP/sunpkcs11.conf"
          {
            echo "name = SimplySign"
            echo "library = $SS_PKCS11"
            echo "slotListIndex = 0"
          } > "$CONF"

          expected_fingerprint="$(printf '%s' "$CERTUM_CERT_FINGERPRINT" | tr -d '[:space:]:')"
          if [[ ! "$expected_fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::CERTUM_CERT_FINGERPRINT must be the signer certificate SHA256 fingerprint."
            exit 1
          fi

          shopt -s nullglob
          pkgs=( signed/*.nupkg )
          [ "${#pkgs[@]}" -gt 0 ] || { echo "::error::no packages matched: signed/*.nupkg"; exit 1; }

          for pkg in "${pkgs[@]}"; do
            echo "::group::sign $pkg"
            timeout 180 java -jar "$JAR" --storetype PKCS11 --keystore "$CONF" --storepass "" \
              --alg SHA-256 --tsmode RFC3161 --tsaurl "http://time.certum.pl" --replace "$pkg"
            timeout 120 dotnet nuget verify "$pkg" --all --certificate-fingerprint "$expected_fingerprint" --verbosity detailed
            echo "::endgroup::"
          done

      - name: Upload signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-nuget
          path: |
            signed/*.nupkg
            !signed/*.symbols.nupkg
          if-no-files-found: error

  publish-nuget:
    name: Release approval and NuGet publish
    needs: [release, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-nuget
          path: signed

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./signed/*.nupkg)
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::no publishable packages matched: ./signed/*.nupkg"; exit 1; }

          for pkg in "${packages[@]}"; do
            timeout 180 dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub release
    needs: [release, publish-nuget]
    permissions:
      contents: write
    uses: reactiveui/actions-common/.github/workflows/workflow-common-create-release.yml@cbd6a02d88ad5d466ddd41482601a7e1e9749509
    with:
      version: ${{ needs.release.outputs.semver2 }}
      tag: ${{ needs.release.outputs.tag }}
      target: ${{ needs.release.outputs.sourceSha }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
      artifactName: signed-nuget
